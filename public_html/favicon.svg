<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <radialGradient id="ocean" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <linearGradient id="land1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="land2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <radialGradient id="sun" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globe-clip"><circle cx="16" cy="16" r="9.2"/></clipPath>
  </defs>

  <!-- Dark disc -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Globe: ocean base -->
  <circle cx="16" cy="16" r="9.2" fill="url(#ocean)"/>

  <!-- Sunlit warmth on globe -->
  <circle cx="16" cy="16" r="9.2" fill="url(#sun)"/>

  <!-- Landmasses (stylized) clipped to globe -->
  <g clip-path="url(#globe-clip)" opacity="0.85">
    <!-- Americas-ish blob -->
    <path d="M11 8.5c1.2-1 2.8-0.8 3.2 0.5 0.3 1-0.2 2.2-1.5 3-0.8 0.5-1.8 0.3-2.2-0.3z" fill="url(#land1)"/>
    <path d="M10.5 12.5c0.8-0.5 2 0 2.5 1 0.5 1.2 0 2.5-1 3-0.8 0.4-1.8 0-2.2-0.8z" fill="url(#land1)"/>
    <!-- Africa/Europe-ish blob -->
    <path d="M17.5 9c1-0.8 2.5-0.5 3 0.8 0.4 1-0.1 2.5-1.2 3.2-0.7 0.4-1.5 0.1-2-0.6z" fill="url(#land2)"/>
    <path d="M17 13.5c0.7-0.3 1.8 0.2 2.2 1.2 0.3 0.8-0.1 1.8-1 2.2-0.6 0.3-1.3-0.1-1.5-0.8z" fill="url(#land2)"/>
    <!-- Asia-ish blob -->
    <path d="M20 8c0.8-0.6 2.2-0.2 2.8 0.8 0.5 0.8 0.1 2-0.8 2.5-0.6 0.3-1.5 0-2.2-0.5z" fill="url(#land1)" opacity="0.7"/>
  </g>

  <!-- Globe rim highlight -->
  <circle cx="16" cy="16" r="9.2" fill="none" stroke="#5eead4" stroke-width="0.8" opacity="0.5"/>

  <!-- Atmosphere haze -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.15" filter="url(#softglow)"/>

  <!-- Pulse ring (live signal) -->
  <circle cx="20.5" cy="12" r="3.8" fill="none" stroke="#f43f5e" stroke-width="0.5" opacity="0.3"/>
  <circle cx="20.5" cy="12" r="2.6" fill="none" stroke="#f43f5e" stroke-width="0.4" opacity="0.2"/>

  <!-- Pulse glow -->
  <circle cx="20.5" cy="12" r="3" fill="url(#pulse)"/>

  <!-- Live dot -->
  <circle cx="20.5" cy="12" r="1.3" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="20.5" cy="12" r="0.55" fill="#fff" opacity="0.95"/>
</svg>
