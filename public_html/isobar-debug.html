<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>isobar geometry</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220}
  #map{position:absolute;inset:0;background:#0b1220}
  .leaflet-container{background:#0b1220}
</style>
</head><body>
<div id="map"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script>
const q = new URLSearchParams(location.search);
const view = (q.get('view') || '20,0,3').split(',').map(Number);
const src = q.get('src') || '/api/weather/isobars?bbox=-263.68,-81.15,263.68,85.65';

const map = L.map('map', { zoomControl: false, attributionControl: false })
             .setView([view[0], view[1]], view[2]);
L.control.zoom({position:'topright'}).addTo(map);
map.createPane('iso');
map.getPane('iso').style.zIndex = '400';

const COLORS = [[960,'#4c1d95'],[980,'#2563eb'],[1000,'#06b6d4'],[1012,'#22c55e'],
                [1020,'#eab308'],[1035,'#ea580c'],[1055,'#b91c1c']];
function color(h){
  if(h<=COLORS[0][0])return COLORS[0][1];
  const L2=COLORS[COLORS.length-1];
  if(h>=L2[0])return L2[1];
  for(let i=0;i<COLORS.length-1;i++){
    const a=COLORS[i],b=COLORS[i+1];
    if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]);
      const p=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
      const ca=p(a[1]),cb=p(b[1]);
      return 'rgb('+ca.map((v,k)=>Math.round(v+(cb[k]-v)*t)).join(',')+')';}
  }
  return L2[1];
}

fetch(src).then(r=>r.json()).then(d=>{
  const items = d.features
    ? d.features.map(f=>({level_hpa:f.properties.level, coordinates:f.geometry.coordinates}))
    : d.items;
  let n=0, pts=0;
  for(const it of items){
    const c=it.coordinates;
    if(c.length<2) continue;
    L.polyline(c.map(p=>[p[1],p[0]]), {pane:'iso', color:color(it.level_hpa),
      weight:2, opacity:0.95, interactive:false}).addTo(map);
    n++; pts+=c.length;
  }
  document.title = n+' lines / '+pts+' pts';
  window.__stats = {lines:n, pts};
});
</script>
</body></html>
