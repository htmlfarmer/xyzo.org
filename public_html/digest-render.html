<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XYZO Digest — render frame</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #070b11;
    --fg: #e6edf3;
    --muted: #8b98a9;
    --accent: #5eead4;
  }
  * { box-sizing: border-box; }
  /* The title card and the lower third are toggled with the `hidden`
     attribute. `display:flex` on an id selector outranks the UA's
     `[hidden] { display: none }`, so restate it — otherwise the title
     card never hides and covers every frame. */
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; background: var(--bg); }
  #map .leaflet-control-attribution { display: none; }
  #map .leaflet-control-zoom { display: none; }

  /* ── location marker ────────────────────────────────────────────── */
  #marker {
    position: absolute; left: 0; top: 0; z-index: 700;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.28), 0 0 26px 8px rgba(94, 234, 212, 0.42);
    pointer-events: none;
  }
  #marker::after {
    content: ""; position: absolute; inset: -13px;
    border-radius: 50%; border: 1px solid rgba(94, 234, 212, 0.55);
  }

  /* ── title card ─────────────────────────────────────────────────── */
  #titlecard {
    position: absolute; inset: 0; z-index: 900;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(1200px 700px at 50% 42%, rgba(94, 234, 212, 0.10), transparent 62%),
      var(--bg);
    text-align: center;
    padding: 0 8%;
  }
  #titlecard .kicker {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 20px; letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 26px;
  }
  #titlecard h1 {
    margin: 0 0 18px; font-size: 68px; line-height: 1.05; font-weight: 800;
    letter-spacing: -0.02em;
  }
  #titlecard .sub {
    font-size: 24px; color: var(--muted); font-weight: 500; max-width: 22ch;
    line-height: 1.35;
  }
  #titlecard .rule {
    width: 120px; height: 3px; margin: 34px 0 26px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  #titlecard .date {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 17px; color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase;
  }

  /* ── lower third ────────────────────────────────────────────────── */
  #lower {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 800;
    padding: 34px 54px 40px;
    background: linear-gradient(180deg, transparent, rgba(4, 8, 13, 0.93) 42%);
    display: flex; align-items: flex-end; gap: 20px;
  }
  #lower .rank {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 40px; font-weight: 800; color: var(--accent);
    line-height: 1; opacity: 0.9; flex-shrink: 0;
  }
  #lower .text { min-width: 0; }
  #lower .where {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 19px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  #lower .head {
    font-size: 33px; font-weight: 700; line-height: 1.2; margin-bottom: 8px;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7);
  }
  #lower .why {
    font-size: 20px; color: var(--muted); line-height: 1.35; max-width: 46ch;
  }
  #lower .foot {
    position: absolute; right: 54px; bottom: 40px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 15px; color: rgba(255, 255, 255, 0.32); letter-spacing: 0.12em;
  }

  /* ── corner brand ───────────────────────────────────────────────── */
  #brand {
    position: absolute; top: 30px; left: 54px; z-index: 800;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 17px; letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    display: flex; align-items: center; gap: 10px;
  }
  #brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="marker" hidden></div>
  <div id="brand"><span class="dot"></span>XYZO</div>

  <div id="titlecard" hidden>
    <div class="kicker">Today's world</div>
    <h1>XYZO Daily</h1>
    <div class="rule"></div>
    <div class="date" id="title-date"></div>
  </div>

  <div id="lower" hidden>
    <div class="rank" id="l-rank">1</div>
    <div class="text">
      <div class="where" id="l-where"></div>
      <div class="head" id="l-head"></div>
      <div class="why" id="l-why"></div>
    </div>
    <div class="foot">XYZO.ORG</div>
  </div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
(function () {
  var STORY = null;
  var TITLE = null;

  // The renderer drives this page through window.renderStory(...) /
  // window.renderTitle(...) so it can capture a frame per beat.
  window.renderTitle = function (opts) {
    TITLE = opts || {};
    var card = document.getElementById("titlecard");
    document.getElementById("title-date").textContent = TITLE.date || "";
    card.hidden = false;
    document.getElementById("lower").hidden = true;
    document.getElementById("marker").hidden = true;
    if (window.map) { document.getElementById("map").style.opacity = "0"; }
  };

  window.renderStory = function (story) {
    STORY = story;
    document.getElementById("titlecard").hidden = true;
    var lower = document.getElementById("lower");
    lower.hidden = false;
    document.getElementById("l-rank").textContent = story.rank;
    document.getElementById("l-where").textContent = story.where || "";
    document.getElementById("l-head").textContent = story.headline || "";
    document.getElementById("l-why").textContent = story.why || "";
    var mapEl = document.getElementById("map");
    mapEl.style.opacity = "1";
    var marker = document.getElementById("marker");
    if (window.map && story.lat != null && story.lng != null) {
      window.map.setView([story.lat, story.lng], story.zoom || 6, { animate: false });
      // The marker sits above the map, positioned in container pixels.
      var p = window.map.latLngToContainerPoint([story.lat, story.lng]);
      marker.style.transform = "translate(" + p.x + "px," + p.y + "px)";
      marker.hidden = false;
    } else {
      marker.hidden = true;
    }
  };

  window.tilesReady = function () {
    return new Promise(function (resolve) {
      if (!window.map) return resolve(false);
      var pending = 0, done = false;
      function check() {
        if (done) return;
        var tiles = document.querySelectorAll("#map img.leaflet-tile");
        var loaded = 0, loading = 0;
        tiles.forEach(function (t) {
          if (t.complete && t.naturalWidth > 0) loaded++;
          else loading++;
        });
        if (loading === 0 && tiles.length > 0) { done = true; resolve(true); }
      }
      // Give Leaflet a moment to start its tile requests, then poll.
      setTimeout(function () {
        var tries = 0;
        var iv = setInterval(function () {
          check();
          if (done || ++tries > 60) { clearInterval(iv); resolve(done); }
        }, 120);
      }, 350);
    });
  };

  function initMap() {
    window.map = L.map("map", {
      zoomControl: false, attributionControl: false,
      worldCopyJump: false, minZoom: 2, maxZoom: 12,
    });
    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 12, minZoom: 2, attribution: "" }
    ).addTo(window.map);
    window.map.setView([20, 0], 2);
    window.mapReady = true;
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initMap, { once: true });
  } else {
    initMap();
  }
})();
</script>
</body>
</html>
