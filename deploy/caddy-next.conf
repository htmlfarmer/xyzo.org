# Dev/staging site — served at xyzo.org/nova
# Edit files in public_html_dev/, see them at xyzo.org/nova
# Deploy to production with: ./deploy.sh

# Add this block INSIDE the xyzo.org { } block in your Caddyfile:

	# ── Dev site: xyzo.org/nova ──────────────────────────────────────
	# Serves dev frontend from public_html_dev/.
	# API requests go to the same backend (port 3008) — no duplication.
	handle_path /nova/* {
		root * /var/www/vhosts/xyzo.org/public_html_dev
		file_server
	}
	handle /nova {
		redir /nova/ permanent
	}
