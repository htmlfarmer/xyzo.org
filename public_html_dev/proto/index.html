<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProtoXYZ - Client Intelligence Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    
    h1 {
      font-size: 1.5rem;
      color: #00d4aa;
      margin-bottom: 20px;
    }
    
    h2 {
      font-size: 1.1rem;
      color: #888;
      margin: 20px 0 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .card {
      background: #151520;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 15px;
    }
    
    .card h3 {
      font-size: 0.9rem;
      color: #00d4aa;
      margin-bottom: 10px;
    }
    
    button {
      background: #00d4aa;
      color: #0a0a0f;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin: 3px;
    }
    
    button:hover { background: #00eebb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #333; color: #fff; }
    button.danger { background: #d44; }
    
    input, select {
      background: #222;
      border: 1px solid #333;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      margin: 3px;
    }
    
    .timing-table {
      width: 100%;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.85rem;
    }
    
    .timing-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #222;
    }
    
    .timing-row .name { color: #888; }
    .timing-row .value { color: #00d4aa; font-weight: bold; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }
    
    .stat-box {
      background: #1a1a25;
      padding: 10px;
      border-radius: 4px;
    }
    
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #00d4aa;
    }
    
    .stat-label {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
    }
    
    .log {
      background: #0a0a0f;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      padding: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.8rem;
    }
    
    .log-entry { padding: 2px 0; }
    .log-entry.info { color: #00d4aa; }
    .log-entry.error { color: #d44; }
    .log-entry.warn { color: #da0; }
    
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.7rem;
      background: #333;
      color: #888;
      margin-left: 5px;
    }
    
    .badge.ready { background: #0a4; color: #fff; }
    .badge.loading { background: #a60; color: #fff; }
    
    #results {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .result-item {
      background: #1a1a25;
      padding: 8px;
      margin: 4px 0;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    
    .result-item .title {
      color: #00d4aa;
      margin-bottom: 4px;
    }
    
    .result-item .meta {
      color: #666;
      font-size: 0.75rem;
    }
    
    .progress-bar {
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }
    
    .progress-bar .fill {
      height: 100%;
      background: #00d4aa;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <h1>ProtoXYZ <span class="badge" id="status-badge">Initializing</span></h1>
  
  <div class="grid">
    <div class="card">
      <h3>Load Data</h3>
      <button id="btn-load" onclick="loadData()">Load Stories (2K)</button>
      <button id="btn-load-5k" onclick="loadData(5000)">Load 5K</button>
      <button id="btn-load-10k" onclick="loadData(10000)">Load 10K</button>
      <div class="progress-bar"><div class="fill" id="load-progress"></div></div>
    </div>
    
    <div class="card">
      <h3>Filter</h3>
      <input type="text" id="filter-search" placeholder="Search title...">
      <select id="filter-category">
        <option value="">All categories</option>
      </select>
      <input type="number" id="filter-sources" placeholder="Min sources" min="1">
      <button onclick="applyFilters()">Apply Filters</button>
      <button class="secondary" onclick="clearFilters()">Clear</button>
    </div>
    
    <div class="card">
      <h3>Sort</h3>
      <select id="sort-by">
        <option value="recency">Recency</option>
        <option value="source_count">Source Count</option>
        <option value="novelty">Novelty</option>
        <option value="confidence">Confidence</option>
        <option value="distance">Distance</option>
      </select>
      <select id="sort-order">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
      </select>
      <button onclick="applySort()">Sort</button>
    </div>
    
    <div class="card">
      <h3>Distance Calculator</h3>
      <input type="number" id="center-lat" placeholder="Lat" step="any">
      <input type="number" id="center-lng" placeholder="Lng" step="any">
      <button onclick="calculateDistances()">Calculate Distances</button>
    </div>
    
    <div class="card">
      <h3>Aggregate</h3>
      <select id="aggregate-by">
        <option value="category">By Category</option>
        <option value="country">By Country</option>
        <option value="day">By Day</option>
        <option value="source_count_bin">By Source Count Range</option>
      </select>
      <button onclick="runAggregation()">Aggregate</button>
    </div>
    
    <div class="card">
      <h3>Cache</h3>
      <button onclick="checkCache()">Check Cache</button>
      <button onclick="CacheDebugger.createPanel()">Open Debug Panel</button>
      <button class="danger" onclick="clearCache()">Clear Cache</button>
    </div>
  </div>
  
  <div class="grid">
    <div class="card">
      <h3>Timing Results <button class="secondary" onclick="runBenchmark()">Run Benchmark (3x)</button></h3>
      <div id="timing-results" class="timing-table">
        <div class="timing-row">
          <span class="name">No data yet</span>
        </div>
      </div>
    </div>
    
    <div class="card">
      <h3>Statistics</h3>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-count">-</div>
          <div class="stat-label">Stories</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-avg-novelty">-</div>
          <div class="stat-label">Avg Novelty</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-avg-sources">-</div>
          <div class="stat-label">Avg Sources</div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <h3>Sync Status</h3>
      <div id="sync-status">
        <div class="timing-row">
          <span class="name">Last Sync</span>
          <span class="value" id="sync-time">Never</span>
        </div>
        <div class="timing-row">
          <span class="name">Data Version</span>
          <span class="value" id="sync-version">-</span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="card">
    <h3>Log</h3>
    <div id="log" class="log"></div>
  </div>
  
  <div class="card">
    <h3>Results <span id="results-count"></span></h3>
    <div id="results"></div>
  </div>

  <script src="timing.js"></script>
  <script src="cache-manager.js"></script>
  <script src="cache-debug.js"></script>
  <script src="delta-sync.js"></script>
  <script src="protoxyz.js"></script>
  
  <script>
    let currentStories = [];
    let filteredStories = [];
    
    async function init() {
      log('info', 'Initializing ProtoXYZ...');
      try {
        CacheDebugger.init();
        await ProtoXYZ.init();
        log('info', 'ProtoXYZ ready');
        document.getElementById('status-badge').textContent = 'Ready';
        document.getElementById('status-badge').className = 'badge ready';
        await updateSyncStatus();
        await populateCategories();
        CacheDebugger.createPanel();
      } catch (e) {
        log('error', 'Init failed: ' + e.message);
      }
    }
    
    async function loadData(limit = 2000) {
      const btn = event.target;
      btn.disabled = true;
      log('info', `Loading ${limit} stories...`);
      
      try {
        Timing.mark('load:start');
        const stories = await ProtoXYZ.loadStories(limit);
        Timing.mark('load:end');
        Timing.measure('load', 'load:start', 'load:end');
        
        currentStories = stories;
        filteredStories = stories;
        
        log('info', `Loaded ${stories.length} stories`);
        log('info', `Network: ${Timing.toJSON().measures.find(m=>m.name==='network')?.duration_ms}ms`);
        
        updateTiming();
        updateStats();
        await updateSyncStatus();
        showResults(stories.slice(0, 20));
      } catch (e) {
        log('error', 'Load failed: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    }
    
    async function applyFilters() {
      if (!currentStories.length) {
        log('warn', 'No data loaded');
        return;
      }
      
      const filters = {};
      const search = document.getElementById('filter-search').value;
      if (search) filters.search = search;
      
      const category = document.getElementById('filter-category').value;
      if (category) filters.category = category;
      
      const minSources = parseInt(document.getElementById('filter-sources').value);
      if (minSources) filters.minSources = minSources;
      
      log('info', 'Applying filters...');
      
      try {
        Timing.mark('filter:start');
        filteredStories = await ProtoXYZ.filterStories(filters);
        Timing.mark('filter:end');
        Timing.measure('filter', 'filter:start', 'filter:end');
        
        log('info', `Filtered: ${filteredStories.length} of ${currentStories.length}`);
        updateTiming();
        updateStats();
        showResults(filteredStories.slice(0, 20));
      } catch (e) {
        log('error', 'Filter failed: ' + e.message);
      }
    }
    
    async function clearFilters() {
      document.getElementById('filter-search').value = '';
      document.getElementById('filter-category').value = '';
      document.getElementById('filter-sources').value = '';
      filteredStories = currentStories;
      log('info', 'Filters cleared');
      showResults(filteredStories.slice(0, 20));
      updateStats();
    }
    
    async function applySort() {
      if (!filteredStories.length) {
        log('warn', 'No data to sort');
        return;
      }
      
      const sortBy = document.getElementById('sort-by').value;
      const order = document.getElementById('sort-order').value;
      
      log('info', `Sorting by ${sortBy} (${order})...`);
      
      try {
        const sorted = await ProtoXYZ.sortStories(filteredStories, sortBy, order);
        filteredStories = sorted;
        updateTiming();
        showResults(filteredStories.slice(0, 20));
      } catch (e) {
        log('error', 'Sort failed: ' + e.message);
      }
    }
    
    async function calculateDistances() {
      const lat = parseFloat(document.getElementById('center-lat').value);
      const lng = parseFloat(document.getElementById('center-lng').value);
      
      if (isNaN(lat) || isNaN(lng)) {
        log('warn', 'Invalid coordinates');
        return;
      }
      
      log('info', `Calculating distances from (${lat}, ${lng})...`);
      
      try {
        const withDistances = await ProtoXYZ.calculateDistances(lat, lng);
        filteredStories = withDistances;
        filteredStories.sort((a, b) => (a._distance || Infinity) - (b._distance || Infinity));
        
        log('info', 'Distances calculated');
        showResults(filteredStories.slice(0, 20));
      } catch (e) {
        log('error', 'Distance calc failed: ' + e.message);
      }
    }
    
    async function runAggregation() {
      if (!currentStories.length) {
        log('warn', 'No data to aggregate');
        return;
      }
      
      const groupBy = document.getElementById('aggregate-by').value;
      log('info', `Aggregating by ${groupBy}...`);
      
      try {
        const result = await ProtoXYZ.aggregate(groupBy);
        console.log('Aggregation result:', result);
        log('info', JSON.stringify(result, null, 2));
      } catch (e) {
        log('error', 'Aggregation failed: ' + e.message);
      }
    }
    
    async function checkCache() {
      try {
        const info = await ProtoXYZ.getStorageInfo();
        if (info) {
          log('info', `Cache: ${(info.usage/1024/1024).toFixed(2)}MB / ${(info.quota/1024/1024).toFixed(0)}MB (${info.percentUsed}%)`);
        }
        
        const count = await ProtoXYZ.CacheDB.count('stories');
        log('info', `Cached stories: ${count}`);
        
        await updateSyncStatus();
      } catch (e) {
        log('error', 'Cache check failed: ' + e.message);
      }
    }
    
    async function clearCache() {
      if (!confirm('Clear all cached data?')) return;
      
      try {
        await ProtoXYZ.CacheDB.clear('stories');
        await ProtoXYZ.CacheDB.clear('metadata');
        log('info', 'Cache cleared');
        await updateSyncStatus();
      } catch (e) {
        log('error', 'Clear failed: ' + e.message);
      }
    }
    
    async function runBenchmark() {
      log('info', 'Running benchmark (3 iterations)...');
      
      try {
        const results = await ProtoXYZ.runBenchmark(3);
        console.log('Benchmark results:', results);
        
        const avg = {
          fetch: 0,
          filter: 0,
          sort: 0,
          total: 0
        };
        
        for (const r of results) {
          for (const m of r.measures) {
            if (avg[m.name] !== undefined) avg[m.name] += m.duration_ms;
          }
        }
        
        for (const key in avg) {
          avg[key] = (avg[key] / results.length).toFixed(2);
        }
        
        log('info', `Benchmark averages: fetch=${avg.fetch}ms, filter=${avg.filter}ms, sort=${avg.sort}ms, total=${avg.total}ms`);
        updateTiming();
      } catch (e) {
        log('error', 'Benchmark failed: ' + e.message);
      }
    }
    
    async function updateSyncStatus() {
      const status = ProtoXYZ.getSyncStatus();
      document.getElementById('sync-time').textContent = status.lastSyncTime ? 
        new Date(status.lastSyncTime).toLocaleString() : 'Never';
      document.getElementById('sync-version').textContent = status.dataVersion || '-';
    }
    
    async function populateCategories() {
      try {
        const stories = await ProtoXYZ.CacheDB.getAll('stories');
        const categories = [...new Set(stories.map(s => s.category).filter(Boolean))];
        
        const select = document.getElementById('filter-category');
        for (const cat of categories.sort()) {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          select.appendChild(opt);
        }
      } catch (e) {
        console.warn('Could not populate categories:', e);
      }
    }
    
    function updateTiming() {
      const timing = Timing.toJSON();
      const container = document.getElementById('timing-results');
      
      if (!timing.measures.length) {
        container.innerHTML = '<div class="timing-row"><span class="name">No timing data</span></div>';
        return;
      }
      
      container.innerHTML = timing.measures.map(m => `
        <div class="timing-row">
          <span class="name">${m.name}</span>
          <span class="value">${m.duration_ms.toFixed(2)} ms</span>
        </div>
      `).join('');
    }
    
    function updateStats() {
      const stories = filteredStories.length ? filteredStories : currentStories;
      
      document.getElementById('stat-count').textContent = stories.length;
      
      if (stories.length) {
        const avgNovelty = stories.reduce((s, s2) => s + (s2.novelty || 0), 0) / stories.length;
        const avgSources = stories.reduce((s, s2) => s + (s2.source_count || 0), 0) / stories.length;
        document.getElementById('stat-avg-novelty').textContent = avgNovelty.toFixed(2);
        document.getElementById('stat-avg-sources').textContent = avgSources.toFixed(1);
      }
    }
    
    function showResults(stories) {
      const container = document.getElementById('results');
      document.getElementById('results-count').textContent = `(${stories.length} shown)`;
      
      container.innerHTML = stories.map(s => `
        <div class="result-item">
          <div class="title">${s.title || 'Untitled'}</div>
          <div class="meta">
            ${s.place_name || s.location?.place_name || 'Unknown location'} |
            Sources: ${s.source_count || 0} |
            Novelty: ${((s.novelty || 0) * 100).toFixed(0)}%
            ${s._distance !== undefined ? ` | Distance: ${s._distance.toFixed(0)}km` : ''}
          </div>
        </div>
      `).join('');
    }
    
    function log(type, message) {
      const container = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    }
    
    // Init on load
    init();
  </script>
</body>
</html>
