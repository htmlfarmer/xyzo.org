<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#5eead4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#5eead4;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#5eead4" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Story pins (scattered across the map) -->
  <g filter="url(#blur)">
    <!-- North America -->
    <circle cx="280" cy="200" r="4" fill="#f97316" opacity="0.8"/>
    <circle cx="310" cy="220" r="3" fill="#ef4444" opacity="0.7"/>
    <circle cx="260" cy="180" r="5" fill="#3b82f6" opacity="0.6"/>
    <!-- Europe -->
    <circle cx="620" cy="170" r="4" fill="#22c55e" opacity="0.8"/>
    <circle cx="650" cy="190" r="3" fill="#f59e0b" opacity="0.7"/>
    <circle cx="600" cy="160" r="5" fill="#ec4899" opacity="0.6"/>
    <circle cx="680" cy="180" r="3" fill="#8b5cf6" opacity="0.7"/>
    <!-- Asia -->
    <circle cx="850" cy="230" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="880" cy="250" r="4" fill="#f97316" opacity="0.7"/>
    <circle cx="820" cy="210" r="3" fill="#06b6d4" opacity="0.6"/>
    <circle cx="910" cy="220" r="4" fill="#22c55e" opacity="0.7"/>
    <!-- Africa -->
    <circle cx="640" cy="350" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="670" cy="370" r="3" fill="#ef4444" opacity="0.7"/>
    <!-- South America -->
    <circle cx="350" cy="400" r="4" fill="#22c55e" opacity="0.8"/>
    <circle cx="380" cy="420" r="3" fill="#3b82f6" opacity="0.7"/>
    <!-- Australia -->
    <circle cx="900" cy="420" r="4" fill="#f97316" opacity="0.8"/>
    <circle cx="920" cy="400" r="3" fill="#8b5cf6" opacity="0.7"/>
  </g>

  <!-- Connection arcs (subtle) -->
  <g stroke="#5eead4" stroke-opacity="0.12" stroke-width="1" fill="none">
    <path d="M 280 200 Q 450 100 620 170"/>
    <path d="M 620 170 Q 730 140 850 230"/>
    <path d="M 620 170 Q 630 260 640 350"/>
    <path d="M 350 400 Q 480 300 620 170"/>
  </g>

  <!-- XYZO Logo text -->
  <text x="100" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#5eead4" letter-spacing="8">XYZO</text>

  <!-- Tagline -->
  <text x="100" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" letter-spacing="3">THE LIVING MAP OF EARTH</text>

  <!-- Stats -->
  <g font-family="system-ui, -apple-system, sans-serif" fill="#e2e8f0">
    <text x="100" y="540" font-size="16" fill="#5eead4" font-weight="600">2,970+</text>
    <text x="180" y="540" font-size="14" fill="#94a3b8">sources</text>
    <text x="280" y="540" font-size="16" fill="#5eead4" font-weight="600">220</text>
    <text x="330" y="540" font-size="14" fill="#94a3b8">countries</text>
    <text x="430" y="540" font-size="16" fill="#5eead4" font-weight="600">50K+</text>
    <text x="490" y="540" font-size="14" fill="#94a3b8">stories/day</text>
    <text x="620" y="540" font-size="16" fill="#5eead4" font-weight="600">AI</text>
    <text x="650" y="540" font-size="14" fill="#94a3b8">powered</text>
  </g>

  <!-- URL -->
  <text x="100" y="590" font-family="ui-monospace, monospace" font-size="18" fill="#475569">xyzo.org</text>
</svg>
